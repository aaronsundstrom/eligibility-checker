
<!DOCTYPE html>
<html>
<head>
  <title>Sierra Ambulance Membership Eligibility</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    input, button { padding: 10px; width: 100%; margin-top: 10px; }
    #result { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }
    #result.eligible { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
    #result.not-eligible { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
    #map { height: 300px; margin-top: 20px; display: none; }
    #signup { display: none; margin-top: 15px; }
    #signup a { background: #007BFF; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <h2>Check Membership Eligibility</h2>
  <p>Enter your address to see if you're within the Sierra Ambulance Service area:</p>

  <input type="text" id="street" placeholder="Street Address">
  <input type="text" id="city" placeholder="City">
  <input type="text" id="zip" placeholder="ZIP Code">
  <button onclick="checkAddress()">Check Eligibility</button>

  <div id="result"></div>
  <div id="map"></div>
  <div id="signup"><a href="https://admin.eservicestech.com/p/Xz2mJ75dYFv4Cu3K!tb73jLq/membership" target="_blank">Click here to sign up for a membership</a></div>

  <script>
    let map, marker;
    const GEOJSON_URL = 'sierra_coverage_area.geojson'; // Place in the same directory

    async function fetchGeoJSON() {
      const res = await fetch(GEOJSON_URL);
      return await res.json();
    }

    async function geocodeAddress(fullAddress) {
      const apiKey = 'AIzaSyDUI4cgBXsQou6ZZLLb1G4aWLbF7GZz5WY';  // Replace with your real key
      const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(fullAddress)}&key=${apiKey}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.status !== "OK" || !data.results.length) {
        throw new Error("Address not found");
      }
      return data.results[0];
    }

    async function checkAddress() {
      const street = document.getElementById('street').value;
      const city = document.getElementById('city').value;
      const zip = document.getElementById('zip').value;
      const address = `${street}, ${city}, ${zip}`;
      const resultBox = document.getElementById('result');
      const signupBox = document.getElementById('signup');
      const mapDiv = document.getElementById('map');
      resultBox.innerText = "Checking...";
      resultBox.className = "";
      resultBox.style.display = "block";
      signupBox.style.display = 'none';

      try {
        const geoResult = await geocodeAddress(address);
        const { lat, lng } = geoResult.geometry.location;
        const pt = turf.point([lng, lat]);
        const geojson = await fetchGeoJSON();

        const isInside = geojson.features.some(feature => {
          return turf.booleanPointInPolygon(pt, feature);
        });

        if (isInside) {
          resultBox.innerHTML = "✓ <strong>You are in the Sierra Ambulance response zone and eligible for membership!</strong>";
          resultBox.className = "eligible";
          signupBox.style.display = 'block';
        } else {
          resultBox.innerHTML = "✖ <strong>You are outside the response zone and not eligible for membership.</strong>";
          resultBox.className = "not-eligible";
        }

        // Show map
        mapDiv.style.display = "block";
        if (!map) {
          map = L.map('map').setView([lat, lng], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          marker = L.marker([lat, lng]).addTo(map);
        } else {
          map.setView([lat, lng], 13);
          marker.setLatLng([lat, lng]);
        }

      } catch (error) {
        resultBox.innerText = "Error: " + error.message;
        resultBox.className = "not-eligible";
        mapDiv.style.display = "none";
      }
    }
  </script>
</body>
</html>
